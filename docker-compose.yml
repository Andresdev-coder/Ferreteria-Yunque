services:
  mysql:
    image: mysql:8.0
    container_name: yunque-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: yunque-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: yunque
      RABBITMQ_DEFAULT_PASS: yunque123
    ports:
      - "5672:5672"     # conexión de los servicios
      - "15672:15672"   # panel web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mysql_data:
  rabbitmq_data: