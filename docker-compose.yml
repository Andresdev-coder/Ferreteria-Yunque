services:
  postgres:
    image: postgres:16-alpine
    container_name: yunque-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yunque
      POSTGRES_PASSWORD: yunque123
      POSTGRES_DB: yunque
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: yunque-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: yunque
      RABBITMQ_DEFAULT_PASS: yunque123
    ports:
      - "5672:5672"     # conexión de los servicios
      - "15672:15672"   # panel web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
